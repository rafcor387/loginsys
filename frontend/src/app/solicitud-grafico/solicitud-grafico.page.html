<ion-header>
  <ion-toolbar>
    <ion-title>Ingresar Datos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="submitForm()">
    <ion-item>
      <ion-label position="floating">ID del Producto</ion-label>
      <ion-input [(ngModel)]="idRepuesto" name="idRepuesto" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Año</ion-label>
      <ion-input [(ngModel)]="anio" name="anio" required></ion-input>
    </ion-item>

    <ion-button expand="full" type="submit">Enviar</ion-button>
  </form>
</ion-content>
