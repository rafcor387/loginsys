<ion-header>
  <ion-toolbar>
    <ion-title>Actualizar Marca</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="updateMarca()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input
        [(ngModel)]="marca.nombre"
        name="nombre"
        required
      ></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Pais</ion-label>
      <ion-input
        [(ngModel)]="marca.pais"
        name="pais"
        required
      ></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Email de contacto</ion-label>
      <ion-input
        [(ngModel)]="marca.email"
        name="email"
        required
      ></ion-input>
    </ion-item>
    
    <ion-item>
      <ion-label position="floating">Direccion</ion-label>
      <ion-input [(ngModel)]="marca.direccion" name="direccion" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Telefono de contacto</ion-label>
      <ion-input
        [(ngModel)]="marca.telefono"
        name="telefono"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Sitio_web</ion-label>
      <ion-input
        [(ngModel)]="marca.sitio_web"
        name="sitio_web"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Descripcion</ion-label>
      <ion-input
        [(ngModel)]="marca.descripcion"
        name="descripcion"
        required
      ></ion-input>
    </ion-item>
    <div>
      <ion-text color="danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </ion-text>
    </div>
    <ion-button expand="full" type="submit">Actualizar Marca</ion-button>
  </form>
</ion-content>
