<ion-header>
  <ion-toolbar>
    <ion-title>Usuario Creado</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="responseData">
    <p><strong>Código:</strong> {{ responseData.codigo }}</p>
    <p><strong>Mensaje:</strong> {{ responseData.message }}</p>
    <p><strong>Contraseña:</strong> {{ responseData.password }}</p>
  </div>
</ion-content>
