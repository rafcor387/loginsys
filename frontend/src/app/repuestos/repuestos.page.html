<ion-header>
  <ion-toolbar>
    <ion-title>Repuestos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-button color="success" (click)="openRegisterModal()" expand="full"
    >Registrar Repuesto</ion-button
  >
  <div>
    <ion-text color="danger" *ngIf="errorMessage">
      {{ errorMessage }}
    </ion-text>
    <ion-text color="success" *ngIf="Message"> {{ Message }} </ion-text>
    <br />
  </div>

  <ion-list>
    <ion-item *ngFor="let repuesto of repuestos">
      <ion-label>
        <h2>{{ repuesto.nombre }}</h2>
        <p>Descripción: {{ repuesto.descripcion }}</p>
        <p>Cantidad en stock: {{ repuesto.cantidad_stock }}</p>
        <p>Precio unitario: {{ repuesto.precio_unitario }}</p>
        <!-- Asegúrate de que la propiedad imagen_url exista en el objeto repuesto -->
        <!-- <img [src]="'http://project.test/backend/public/storage/imagenes/342bwi6XVa6KPl9zzLKSip72X9HHTndWxppDpiit.png'" style="width: 100px; height: auto;"> -->
        <img
          [src]="'http://project.test/backend/public/storage/'  + repuesto.imagen"
          style="width: 100px; height: auto"
        />
      </ion-label>
      <div class="button-container">
        <ion-button color="danger" (click)="DeleteRepuesto(repuesto.id)">Eliminar</ion-button>
        <ion-button color="primary" (click)="openUpdateModal(repuesto)">Editar</ion-button>
      </div>
    </ion-item>
  </ion-list>
</ion-content>
