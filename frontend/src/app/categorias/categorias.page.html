<ion-header>
  <ion-toolbar>
    <ion-title>Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="form-wrapper">
    <h4 style="text-align: center;">Categorias</h4>
    <!-- Formulario para agregar o actualizar una categoría -->
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input [(ngModel)]="categoriaForm.nombre" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Descripción</ion-label>
      <ion-input [(ngModel)]="categoriaForm.descripcion"></ion-input>
    </ion-item>

    <!-- Botón para agregar o actualizar -->
    <ion-button *ngIf="!isEditMode" expand="full" (click)="AddCategoria()">Agregar Categoría</ion-button>
    <ion-button *ngIf="isEditMode" expand="full" color="success" (click)="UpdateCategoria()">Actualizar Categoría</ion-button>

    <!-- Botón de cancelar cuando se está en modo de edición -->
    <ion-button *ngIf="isEditMode" expand="full" color="medium" (click)="cancelEdit()">Cancelar</ion-button>

    <!-- Mensaje de error -->
    <ion-note color="danger" *ngIf="errorMessage">{{ errorMessage }}</ion-note>

    <!-- Lista de categorías -->
    <ion-list>
      <ion-item *ngFor="let categoria of categorias">
        <ion-label>
          <h2>{{ categoria.nombre }}</h2>
          <p>{{ categoria.descripcion }}</p> <!-- Mostrar descripción debajo del nombre -->
        </ion-label>
        <ion-button (click)="selectCategoria(categoria)">Editar</ion-button>
        <ion-button color="danger" (click)="DeleteCategoria(categoria.id)">Eliminar</ion-button>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
