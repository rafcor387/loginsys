<ion-header>
  <ion-toolbar>
    <ion-title>Registrar Categoria</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (submit)="AddCategoria()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input [(ngModel)]="nuevacategoria.nombre" name="nombre" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Descripcion</ion-label>
      <ion-input [(ngModel)]="nuevacategoria.descripcion" name="descripcion"></ion-input>
    </ion-item>
    
    <ion-button expand="full" type="submit">Agregar Categoria</ion-button>
    <div *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</div>
  </form>
</ion-content>
